name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  DOTNET_VERSION: "10.x"
  NODE_VERSION: "22"

jobs:
  build-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/screendrafts.api

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore screendrafts.api.slnx

      - name: Build
        run: dotnet build screendrafts.api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution screendrafts.api.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish screendrafts.api.slnx --configuration Release --no-restore --no-build

  build-ui:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/screendrafts.ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/screendrafts.ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
