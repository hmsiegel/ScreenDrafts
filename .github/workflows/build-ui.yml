# .github/workflows/build-ui.yml
name: Build UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/screendrafts.ui/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/screendrafts.ui/**'

permissions:
  contents: read

concurrency:
  group: build-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/screendrafts.ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/screendrafts.ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000