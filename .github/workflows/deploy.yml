name: Deploy

on:
  workflow_run:
    workflows: ["Build API"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/hmsiegel/screendrafts/api
  IMAGE_MIGRATOR: ghcr.io/hmsiegel/screendrafts/migrator

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (Migrator)
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_MIGRATOR }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: src/screendrafts.api
          file: src/screendrafts.api/src/api/ScreenDrafts.Web/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Migrator image
        uses: docker/build-push-action@v5
        with:
          context: src/screendrafts.api
          file: src/screendrafts.api/tools/ScreenDrafts.Tools.DbMigrator/Dockerfile
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/screendrafts
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u hmsiegel --password-stdin
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.production.yml pull
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f