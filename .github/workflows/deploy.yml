# .github/workflows/deploy.yml
name: Deploy

# Runs after "Build API" succeeds on a push to main (deploys to production) or
# to test (deploys to the TEST server).
#
# GitHub runs the copy of this file on the default branch (main) for every
# workflow_run event, so a change here takes effect only once it is on main.
on:
  workflow_run:
    workflows: ["Build API"]
    types:
      - completed
    branches:
      - main
      - test

# Nothing by default; the job below grants only what it needs.
permissions: {}

# One deploy per environment at a time; a second one waits for the first.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/hmsiegel/screendrafts/api
  IMAGE_MIGRATOR: ghcr.io/hmsiegel/screendrafts/migrator

jobs:
  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main -> production (waits for your approval); test -> test.
    # With workflow_run the job's ref is always the default branch, so the test
    # environment must NOT restrict deployment branches. This expression is
    # the guard that keeps a test run away from production secrets.
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'test' }}
    # Only deploy a green push, never a PR-triggered Build API run.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: read
      packages: write
    env:
      # The exact commit whose tests passed, not whatever the branch is by now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Promotion case: TEST already built this commit, so PROD deploys the
      # exact image TEST ran instead of building a second one.
      - name: Check for images already built for this commit
        id: existing
        run: |
          if docker buildx imagetools inspect "${IMAGE_API}:${DEPLOY_SHA}" > /dev/null 2>&1 \
            && docker buildx imagetools inspect "${IMAGE_MIGRATOR}:${DEPLOY_SHA}" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Images for ${DEPLOY_SHA} already exist; skipping the build."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (API)
        if: ${{ steps.existing.outputs.built != 'true' }}
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Extract metadata (Migrator)
        if: ${{ steps.existing.outputs.built != 'true' }}
        id: meta-migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_MIGRATOR }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push API image
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/screendrafts.api
          file: src/screendrafts.api/src/api/ScreenDrafts.Web/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Migrator image
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/screendrafts.api
          file: src/screendrafts.api/tools/ScreenDrafts.Tools.DbMigrator/Dockerfile
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Config files travel with the deploy, so the server never drifts from the
      # repo. Server-only files (.env, secrets/, keycloak/) are never touched.
      # Tailscale already authenticates the host, so accept its key on first use.
      - name: Sync config files to the server
        env:
          VPS_HOST: ${{ secrets.VPS_TAILSCALE_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "${VPS_SSH_KEY}" > "${key}"
          chmod 600 "${key}"
          opts=(-i "${key}" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$(mktemp)")
          dest="${VPS_USER}@${VPS_HOST}"

          # send LOCAL REMOTE  — copy one file; skip with a warning if it is not in the repo.
          send() {
            if [ -f "$1" ]; then
              scp "${opts[@]}" "$1" "${dest}:$2"
            else
              echo "::warning::$1 is not in the repo; skipped"
            fi
          }

          send infrastructure/compose/docker-compose.production.yml /opt/screendrafts/docker-compose.production.yml
          send infrastructure/caddy/Caddyfile /opt/screendrafts/infrastructure/caddy/Caddyfile
          send infrastructure/backup/backup.sh /opt/screendrafts/infrastructure/backup/backup.sh

          # TEST only: hostnames and the mail sink. PROD has no overrides file.
          if [ "${DEPLOY_BRANCH}" = "test" ]; then
            ssh "${opts[@]}" "${dest}" "mkdir -p /opt/screendrafts/infrastructure/test"
            send infrastructure/test/overrides.env /opt/screendrafts/overrides.env
            send infrastructure/test/restore-test.sh /opt/screendrafts/infrastructure/test/restore-test.sh
            send infrastructure/test/scrub.sql /opt/screendrafts/infrastructure/test/scrub.sql
          fi
          rm -f "${key}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          # Passed as environment variables, not templated into the script text.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_TAILSCALE_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd /opt/screendrafts
            echo "$GHCR_TOKEN" | docker login ghcr.io -u hmsiegel --password-stdin
            # Persist the tag so a later manual `docker compose` command keeps
            # this version instead of falling back to `latest`. Needs write
            # access to .env for the CI account (chmod 660, group = CI user).
            tmp=$(mktemp)
            grep -v '^IMAGE_TAG=' .env > "$tmp" || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"
            export IMAGE_TAG
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            # A bind-mounted Caddyfile can change without recreating the container.
            docker compose -f docker-compose.production.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f

      # `latest` now means "what production runs". TEST builds never move it.
      - name: Move the latest tag (production only)
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        run: |
          docker buildx imagetools create -t "${IMAGE_API}:latest" "${IMAGE_API}:${DEPLOY_SHA}"
          docker buildx imagetools create -t "${IMAGE_MIGRATOR}:latest" "${IMAGE_MIGRATOR}:${DEPLOY_SHA}"
