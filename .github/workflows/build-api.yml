# .github/workflows/build-api.yml
name: Build API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/screendrafts.api/**'
      - 'tools/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/screendrafts.api/**'
      - 'tools/**'

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main are never cancelled,
# so every main push reaches the Deploy workflow.
concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.x"

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/screendrafts.api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore screendrafts.api.slnx

      - name: Build
        run: dotnet build screendrafts.api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution screendrafts.api.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish screendrafts.api.slnx --configuration Release --no-restore --no-build