# .github/workflows/build-theme.yml
name: Build Keycloak theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/screendrafts-keycloak-theme/**'
      - '.github/workflows/build-theme.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/screendrafts-keycloak-theme/**'
      - '.github/workflows/build-theme.yml'

permissions:
  contents: read

concurrency:
  group: build-theme-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/screendrafts-keycloak-theme

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/screendrafts-keycloak-theme/package-lock.json

      # keycloakify build compiles the jar with Maven. GitHub's ubuntu-latest
      # image ships a JDK and Maven; this step just records which ones.
      - name: Toolchain
        run: |
          java -version
          mvn -v

      - name: Install dependencies
        run: npm ci

      # tsc + vite build, then keycloakify build (the same steps as build-jar.py)
      - name: Build theme
        run: npm run build-keycloak-theme

      # Same sanity checks as build-jar.py: without these entries Keycloak
      # cannot render the login pages.
      - name: Check the jar
        run: |
          ls -la dist_keycloak/*.jar
          for jar in dist_keycloak/*.jar; do
            unzip -l "$jar" | grep -q "META-INF/keycloak-themes.json"
            unzip -l "$jar" | grep -q "theme/screendrafts/login/"
            echo "$jar: $(unzip -l "$jar" | grep -c '\.ftl$') .ftl templates"
          done
