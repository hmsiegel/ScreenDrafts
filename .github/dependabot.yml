# .github/dependabot.yml
version: 2

updates:
  # .NET: Directory.Packages.props at this root drives every project's versions.
  - package-ecosystem: nuget
    directory: /src/screendrafts.api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /src/screendrafts.ui
      - /src/screendrafts-keycloak-theme
      - /tools/draft-scraper
      - /tools/drafter-scraper
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfiles that ship to production.
  - package-ecosystem: docker
    directories:
      - /src/screendrafts.api/src/api/ScreenDrafts.Web
      - /src/screendrafts.api/src/api/ScreenDrafts.Gateway
      - /src/screendrafts.api/tools/ScreenDrafts.Tools.DbMigrator
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]

  # Images pinned in the compose files (Keycloak, Postgres, Caddy, ...).
  - package-ecosystem: docker-compose
    directories:
      - /infrastructure/compose
      - /src/screendrafts.api
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # Stateful services: a major bump can need a data or schema migration.
      # Upgrade these by hand, with a backup. (Keycloak: the realm import and
      # theme/authenticator JARs are also version-sensitive.)
      - dependency-name: "quay.io/keycloak/keycloak"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rabbitmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/vault"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]