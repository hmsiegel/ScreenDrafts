services:

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - screendrafts
    depends_on:
      - screendrafts.web

  # ── Migrator (one-shot) ────────────────────────────────────────────────────
  screendrafts.migrator:
    image: ghcr.io/hmsiegel/screendrafts/migrator:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    secrets:
      - ConnectionStrings__Database
      - ConnectionStrings__Administration
      - ConnectionStrings__Audit
      - ConnectionStrings__Communications
      - ConnectionStrings__Drafts
      - ConnectionStrings__GuestDrafts
      - ConnectionStrings__Integrations
      - ConnectionStrings__Movies
      - ConnectionStrings__RealTimeUpdates
      - ConnectionStrings__Reporting
      - ConnectionStrings__Users
    networks:
      - screendrafts
    depends_on:
      screendrafts.database:
        condition: service_healthy

  # ── API ────────────────────────────────────────────────────────────────────
  screendrafts.web:
    image: ghcr.io/hmsiegel/screendrafts/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - KeycloakRegistration__Secret=${KEYCLOAK_REGISTRATION_SECRET}
    secrets:
      - ConnectionStrings__Database
      - ConnectionStrings__Administration
      - ConnectionStrings__Audit
      - ConnectionStrings__Communications
      - ConnectionStrings__Drafts
      - ConnectionStrings__GuestDrafts
      - ConnectionStrings__Integrations
      - ConnectionStrings__Movies
      - ConnectionStrings__RealTimeUpdates
      - ConnectionStrings__Reporting
      - ConnectionStrings__Users
      - ConnectionStrings__Cache
      - ConnectionStrings__Queue
      - ConnectionStrings__Mongo
      - MediatR__LicenseKey
      - Audit__KeycloakPoller__ConfidentialClientSecret
      - Users__KeyCloak__ConfidentialClientSecret
      - Integrations__Tmdb__AccessToken
      - Integrations__Imdb__Key
      - Integrations__Omdb__Key
      - Integrations__Igdb__ClientId
      - Integrations__Igdb__ClientSecret
      - Integrations__Zoom__AccountId
      - Integrations__Zoom__ClientId
      - Integrations__Zoom__ClientSecret
      - Integrations__Zoom__WebhookSecretToken
      - Users__EmailBootstrap__Secret
      - RabbitMq__UserName
      - RabbitMq__Password
    networks:
      - screendrafts
    depends_on:
      screendrafts.migrator:
        condition: service_completed_successfully
      screendrafts.database:
        condition: service_healthy
      screendrafts.identity:
        condition: service_started
      screendrafts.redis:
        condition: service_started
      screendrafts.queue:
        condition: service_started
      screendrafts.mongo:
        condition: service_started

  # ── PostgreSQL (app) ───────────────────────────────────────────────────────
  screendrafts.database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: screendrafts
      POSTGRES_USER_FILE: /run/secrets/pg_superuser
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superpassword
      PGDATA: /var/lib/postgresql/data
    secrets:
      - pg_superuser
      - pg_superpassword
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - screendrafts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/pg_superuser) -d screendrafts"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  # ── Keycloak ───────────────────────────────────────────────────────────────
  screendrafts.identity:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=https://auth.screen-drafts.com
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADER=xforwarded
      - KEYCLOAK_ADMIN_FILE=/run/secrets/keycloak_admin_user
      - KEYCLOAK_ADMIN_PASSWORD_FILE=/run/secrets/keycloak_admin_password
      - SD_API_URL=http://screendrafts.web:8080
      - SD_KEYCLOAK_SECRET_FILE=/run/secrets/keycloak_registration_secret
      - REGISTER_URL=https://www.screen-drafts.com/register
    secrets:
      - keycloak_admin_user
      - keycloak_admin_password
      - keycloak_registration_secret
    volumes:
      - /opt/screendrafts/keycloak/import:/opt/keycloak/data/import:ro
      - /opt/screendrafts/keycloak/providers/keycloak-theme-screendrafts.jar:/opt/keycloak/providers/keycloak-theme-screendrafts.jar:ro
      - /opt/screendrafts/keycloak/providers/screendrafts-authenticator-1.0.0.jar:/opt/keycloak/providers/screendrafts-authenticator-1.0.0.jar:ro
    networks:
      - screendrafts
    depends_on:
      keycloak-db:
        condition: service_healthy

  # ── Keycloak DB ────────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER_FILE: /run/secrets/keycloak_db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - keycloak_db_user
      - keycloak_db_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - screendrafts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/keycloak_db_user) -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  screendrafts.redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - screendrafts

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  screendrafts.queue:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    hostname: screendrafts-queue
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - screendrafts

  # ── MongoDB ────────────────────────────────────────────────────────────────
  screendrafts.mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_user
      - mongo_password
    volumes:
      - mongo_data:/data/db
    networks:
      - screendrafts

  # ── PostgreSQL Backup ──────────────────────────────────────────────────────
  screendrafts.backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: screendrafts.database
      PGDATABASE: screendrafts
      PGUSER_FILE: /run/secrets/pg_superuser
      PGPASSWORD_FILE: /run/secrets/pg_superpassword
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret
    secrets:
      - pg_superuser
      - pg_superpassword
      - keycloak_db_user
      - keycloak_db_password
      - backup_s3_key
      - backup_s3_secret
    volumes:
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        apt-get update && apt-get install -y --no-install-recommends awscli && rm -rf /var/lib/apt/lists/*
        while true; do
          sh /backup.sh
          sleep 86400
        done
    networks:
      - screendrafts
    depends_on:
      screendrafts.database:
        condition: service_healthy

# ── Secrets ────────────────────────────────────────────────────────────────
# File paths intentionally match the secret name so the mounted filename
# under /run/secrets/ is identical to what AddKeyPerFile expects.
secrets:
  pg_superuser:
    file: ./secrets/pg_superuser.txt
  pg_superpassword:
    file: ./secrets/pg_superpassword.txt

  ConnectionStrings__Database:
    file: ./secrets/ConnectionStrings__Database.txt
  ConnectionStrings__Administration:
    file: ./secrets/ConnectionStrings__Administration.txt
  ConnectionStrings__Audit:
    file: ./secrets/ConnectionStrings__Audit.txt
  ConnectionStrings__Communications:
    file: ./secrets/ConnectionStrings__Communications.txt
  ConnectionStrings__Drafts:
    file: ./secrets/ConnectionStrings__Drafts.txt
  ConnectionStrings__GuestDrafts:
    file: ./secrets/ConnectionStrings__GuestDrafts.txt
  ConnectionStrings__Integrations:
    file: ./secrets/ConnectionStrings__Integrations.txt
  ConnectionStrings__Movies:
    file: ./secrets/ConnectionStrings__Movies.txt
  ConnectionStrings__RealTimeUpdates:
    file: ./secrets/ConnectionStrings__RealTimeUpdates.txt
  ConnectionStrings__Reporting:
    file: ./secrets/ConnectionStrings__Reporting.txt
  ConnectionStrings__Users:
    file: ./secrets/ConnectionStrings__Users.txt

  redis_password:
    file: ./secrets/redis_password.txt
  ConnectionStrings__Cache:
    file: ./secrets/ConnectionStrings__Cache.txt

  rabbitmq_user:
    file: ./secrets/rabbitmq_user.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  ConnectionStrings__Queue:
    file: ./secrets/ConnectionStrings__Queue.txt

  mongo_user:
    file: ./secrets/mongo_user.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  ConnectionStrings__Mongo:
    file: ./secrets/ConnectionStrings__Mongo.txt

  keycloak_db_user:
    file: ./secrets/keycloak_db_user.txt
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  keycloak_admin_user:
    file: ./secrets/keycloak_admin_user.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  keycloak_registration_secret:
    file: ./secrets/keycloak_registration_secret.txt
  Audit__KeycloakPoller__ConfidentialClientSecret:
    file: ./secrets/Audit__KeycloakPoller__ConfidentialClientSecret.txt
  Users__KeyCloak__ConfidentialClientSecret:
    file: ./secrets/Users__KeyCloak__ConfidentialClientSecret.txt

  MediatR__LicenseKey:
    file: ./secrets/MediatR__LicenseKey.txt
  Integrations__Tmdb__AccessToken:
    file: ./secrets/Integrations__Tmdb__AccessToken.txt
  Integrations__Imdb__Key:
    file: ./secrets/Integrations__Imdb__Key.txt
  Integrations__Omdb__Key:
    file: ./secrets/Integrations__Omdb__Key.txt
  Integrations__Igdb__ClientId:
    file: ./secrets/Integrations__Igdb__ClientId.txt
  Integrations__Igdb__ClientSecret:
    file: ./secrets/Integrations__Igdb__ClientSecret.txt
  Integrations__Zoom__AccountId:
    file: ./secrets/Integrations__Zoom__AccountId.txt
  Integrations__Zoom__ClientId:
    file: ./secrets/Integrations__Zoom__ClientId.txt
  Integrations__Zoom__ClientSecret:
    file: ./secrets/Integrations__Zoom__ClientSecret.txt
  Integrations__Zoom__WebhookSecretToken:
    file: ./secrets/Integrations__Zoom__WebhookSecretToken.txt

  Users__EmailBootstrap__Secret:
    file: ./secrets/Users__EmailBootstrap__Secret.txt

  RabbitMq__UserName:
    file: ./secrets/RabbitMq__UserName.txt
  RabbitMq__Password:
    file: ./secrets/RabbitMq__Password.txt

  backup_s3_key:
    file: ./secrets/backup_s3_key.txt
  backup_s3_secret:
    file: ./secrets/backup_s3_secret.txt

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  keycloak_db_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
  caddy_data:
  caddy_config:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  screendrafts:
    name: screendrafts
    driver: bridge
